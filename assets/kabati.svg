<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Kabati app launcher icon</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151515"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
  </defs>

  <!-- Rounded black app tile -->
  <rect width="512" height="512" rx="92" fill="url(#bg)"/>

  <!-- Shelf frame forming the vertical stem of the K -->
  <rect x="112" y="126" width="100" height="260" rx="18"
        fill="none" stroke="#fff" stroke-width="18"/>

  <!-- Three shelf dividers -->
  <path d="M121 212 H203 M121 300 H203"
        fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round"/>

  <!-- App grid on top shelf -->
  <g fill="#3698f5">
    <rect x="137" y="151" width="25" height="25" rx="6"/>
    <rect x="171" y="151" width="25" height="25" rx="6"/>
    <rect x="137" y="184" width="25" height="19" rx="5"/>
    <rect x="171" y="184" width="25" height="19" rx="5"/>
  </g>

  <!-- Folder on middle shelf -->
  <path d="M137 243 Q137 236 144 236 H162 L171 246 H191
           Q198 246 198 253 V282 Q198 289 191 289 H144
           Q137 289 137 282 Z" fill="#3698f5"/>
  <path d="M143 255 H197 L190 282 Q189 286 184 286 H144
           Q138 286 139 280 Z" fill="#2584e8"/>

  <!-- Settings gear on bottom shelf -->
  <g transform="translate(162 344)" fill="#fff">
    <path d="M-5 -34 H5 L8 -26 L16 -23 L24 -27 L31 -20 L27 -12
             L30 -4 L38 0 V10 L30 14 L27 22 L31 30 L24 37
             L16 33 L8 36 L5 44 H-5 L-8 36 L-16 33 L-24 37
             L-31 30 L-27 22 L-30 14 L-38 10 V0 L-30 -4
             L-27 -12 L-31 -20 L-24 -27 L-16 -23 L-8 -26 Z"
          transform="scale(.78)"/>
    <circle r="10" fill="#080808"/>
  </g>

  <!-- K arms: bold, simple and geometric -->
  <path d="M225 250 L326 145 H389 L282 256 L394 367 H329 L225 267 Z"
        fill="#fff" stroke="#fff" stroke-linejoin="round" stroke-width="8"/>
</svg>
